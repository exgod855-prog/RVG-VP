# fly.toml app configuration file generated for name on 2026-11-16T11:47:59Z
#
# See https://docs.fly.io/reference/configuration for information about how to use this file.
#

app = "name"
primary_region = 'fra'

[env]
DATA_DIR = "/data"
PORT = "8080"

[http_service]
auto_start_machines = true
auto_stop_machines = false
force_https = true
internal_port = 8080
min_machines_running = 1

[[mounts]]
destination = "/data"
source = "data"

[[vm]]
  memory = '512mb'
  size = 'shared-cpu-1x'
